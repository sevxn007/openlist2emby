services:
  openlist2emby:
    image: ${OPENLIST2EMBY_IMAGE:-openlist2emby:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OPENLIST2EMBY_HTTP_PORT:-8091}:8091"
      - "${OPENLIST2EMBY_EMBY_PORT:-8096}:${OPENLIST2EMBY_EMBY_PORT:-8096}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENLIST2EMBY_TASK_WORKERS: "${OPENLIST2EMBY_TASK_WORKERS:-1}"
      OPENLIST2EMBY_TASK_RETENTION_DAYS: "${OPENLIST2EMBY_TASK_RETENTION_DAYS:-30}"
    volumes:
      - openlist2emby-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/api/manager/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  openlist2emby-data:
