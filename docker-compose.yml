services:
  openlist2emby:
    image: ghcr.io/sevxn007/openlist2emby:dev
    container_name: openlist2emby
    restart: unless-stopped
    ports:
      - "8091:8091"
      - "8096:8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      OPENLIST2EMBY_TASK_WORKERS: "1"
      OPENLIST2EMBY_TASK_RETENTION_DAYS: "30"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/api/manager/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
